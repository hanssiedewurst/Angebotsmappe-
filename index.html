<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angebotsmappe</title>
<meta name="description" content="Angebote für Neu- und Bestandskunden zusammenklicken: Paket, Betrieb, Module und Schulungen, mit monatlichen und einmaligen Kosten.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#142024" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angebot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: Schrittleiste links · Arbeitsfläche Mitte · laufender Kostenbon rechts (mobil gestapelt) */
:root {
  --bg: #EEF2F3;
  --surface: #FFFFFF;
  --surface-2: #E4EBED;
  --line: #CDD8DB;
  --fg: #142024;
  --muted: #56686E;
  --accent: #0B6A70;
  --accent-fg: #FFFFFF;
  --accent-soft: #D5EBEB;
  --deal: #9A520A;
  --deal-soft: #FAE9D4;
  --good: #2E7D32;
  --danger: #B3261E;
  --f-display: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-num: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1416; --surface: #142024; --surface-2: #1B2B30; --line: #2A3D43;
    --fg: #E2EBED; --muted: #93A6AC; --accent: #52C0C4; --accent-fg: #062629;
    --accent-soft: #143A3D; --deal: #F1AA5E; --deal-soft: #3A2815; --good: #7CC981; --danger: #F08A82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1416; --surface: #142024; --surface-2: #1B2B30; --line: #2A3D43;
  --fg: #E2EBED; --muted: #93A6AC; --accent: #52C0C4; --accent-fg: #062629;
  --accent-soft: #143A3D; --deal: #F1AA5E; --deal-soft: #3A2815; --good: #7CC981; --danger: #F08A82;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; font-weight: 700; font-stretch: 108%; letter-spacing: -0.01em; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .price, .money { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

/* Kopfzeile */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 1.25rem; font-weight: 800; font-stretch: 115%; letter-spacing: -0.01em; }
.brand-mark { width: 14px; height: 14px; border-radius: 3px; background: var(--accent); align-self: center; box-shadow: 4px 4px 0 var(--deal-soft); }
.store-badge { font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.mod-price .muted { font-family: var(--f-body); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 550; line-height: 1.2; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.current { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 0.85rem; }

/* Grundlayout */
.layout { max-width: 1320px; margin: 0 auto; display: grid; gap: 24px; align-items: start;
  grid-template-columns: 210px minmax(0, 1fr) 330px;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.layout[data-mode="summary"] { grid-template-columns: 210px minmax(0, 1fr); }
.layout[data-mode="page"] { grid-template-columns: minmax(0, 1fr); }
.layout[data-mode="summary"] #receipt, .layout[data-mode="page"] #receipt, .layout[data-mode="page"] #rail { display: none; }
main { min-width: 0; }

/* Schrittleiste */
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; }
.rail button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 0 10px; align-items: start;
  border: 0; background: transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.rail button:hover { background: var(--surface-2); }
.rail .n { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center;
  font-family: var(--f-num); font-size: 0.8rem; color: var(--muted); background: var(--surface); }
.rail .lbl { font-weight: 600; }
.rail .val { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .done .n { border-color: var(--accent); color: var(--accent); }
.rail .active { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.rail .active .n { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* Schritt-Inhalt */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 26px; }
.step-head { display: flex; flex-direction: column; gap: 6px; }
.step-head p.lead { color: var(--muted); max-width: 62ch; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend, .label { font-weight: 650; font-size: 0.9rem; padding: 0; margin-bottom: 10px; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.choice { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; min-width: 0; }
.choice:hover { border-color: var(--accent); }
.choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.choice-title { font-weight: 650; font-size: 1rem; }
.choice-sub { font-size: 0.85rem; color: var(--muted); }
.choice .tag { align-self: flex-start; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--deal-soft); color: var(--deal); }
.choice .price { font-size: 1.15rem; font-weight: 600; margin-top: 6px; }
.choice .price small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.choice .price-sub { font-size: 0.82rem; color: var(--muted); }
.choice.pkg { padding: 18px; }
.choice.pkg .choice-title { font-family: var(--f-display); font-size: 1.25rem; font-stretch: 110%; font-weight: 750; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 0.85rem; font-weight: 600; }
.field .hint { font-size: 0.78rem; color: var(--muted); }
input[type="text"], input[type="email"], input[type="number"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 84px; }
textarea.code { font-family: var(--f-num); font-size: 0.82rem; }

.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.stepper button { border: 0; background: transparent; width: 38px; font-size: 1.1rem; cursor: pointer; }
.stepper button:hover { background: var(--surface-2); }
.stepper input { width: 70px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; text-align: center; background: var(--surface); font-family: var(--f-num); }
.stepper input:focus { box-shadow: none; }

.callout { border-radius: var(--r); background: var(--surface-2); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.callout .money { font-size: 1.05rem; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: var(--f-num); font-size: 0.85rem; }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Module */
.mods { display: flex; flex-direction: column; gap: 10px; }
.mod { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.mod.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.switch { width: 44px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--accent-fg); }
.mod-info { min-width: 0; }
.mod-info .t { font-weight: 650; }
.mod-info .d { font-size: 0.85rem; color: var(--muted); }
.mod-price { text-align: right; font-family: var(--f-num); font-size: 0.9rem; }
.mod-price b { display: block; font-size: 1rem; }
.mod-qty { grid-column: 2 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 6px; }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }

/* Kostenbon */
.receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
.receipt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.receipt table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.receipt th { text-align: right; font-weight: 600; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 4px; }
.receipt th:first-child { text-align: left; }
.receipt td { padding: 5px 0; vertical-align: top; border-top: 1px dashed var(--line); }
.receipt td.m { text-align: right; font-family: var(--f-num); white-space: nowrap; padding-left: 8px; }
.receipt td .d { display: block; color: var(--muted); font-size: 0.76rem; }
.receipt tr.disc td { color: var(--deal); }
.receipt tfoot td { border-top: 1.5px solid var(--fg); font-weight: 650; padding-top: 8px; }
.receipt .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tot { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.tot .money { font-size: 1.15rem; font-weight: 600; display: block; }
.tot.m { background: var(--accent-soft); }
.example-note { font-size: 0.78rem; color: var(--deal); background: var(--deal-soft); border-radius: 8px; padding: 8px 10px; }

/* Übersicht */
.sum-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.sum-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 0.78rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--fg); }
.pill.deal { background: var(--deal-soft); color: var(--deal); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: var(--good); }
.sum-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.cost-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.cost-card header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); }
.cost-card.m header { background: var(--accent-soft); }
.cost-card.o header { background: var(--surface-2); }
.cost-card table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.cost-card td { padding: 9px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cost-card td.m { text-align: right; font-family: var(--f-num); white-space: nowrap; }
.cost-card td .d { display: block; color: var(--muted); font-size: 0.8rem; }
.cost-card tr.sub td { font-weight: 600; }
.cost-card tr.disc td { color: var(--deal); }
.cost-card tr.vat td { color: var(--muted); border-bottom: 0; }
.cost-card .grand { margin-top: auto; padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 2px solid var(--fg); flex-wrap: wrap; }
.cost-card .grand .money { font-size: 1.6rem; font-weight: 600; }
.cost-card .empty { padding: 18px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.fact .money { font-size: 1.1rem; font-weight: 600; display: block; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
details.box { border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
details.box > summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
details.box[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
details.box > div { padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
pre.json { margin: 0; max-height: 360px; overflow: auto; background: var(--bg); border-radius: 8px; padding: 12px; font-family: var(--f-num); font-size: 0.78rem; }

/* Einstellungen & Angebote */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.edit { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.88rem; }
table.edit th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 10px 8px; background: var(--surface-2); white-space: nowrap; }
table.edit td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
table.edit input, table.edit select { padding: 6px 8px; }
table.edit input[type="number"] { width: 96px; font-family: var(--f-num); }
table.edit td.c { text-align: center; }
.settings-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.status-line { font-size: 0.85rem; color: var(--muted); }
.q-list { display: flex; flex-direction: column; }
.q-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
.q-row .t { font-weight: 650; }
.q-row .money { text-align: right; white-space: nowrap; font-size: 0.88rem; }
.q-row .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.q-row select { width: auto; padding: 5px 8px; font-size: 0.85rem; }
.empty-state { padding: 30px 10px; text-align: center; color: var(--muted); }

.sneaky { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid transparent; background: transparent;
  color: var(--line); font-family: var(--f-num); font-size: 0.8rem; cursor: pointer; padding: 0; }
.sneaky:hover { color: var(--muted); border-color: var(--line); }
.sneaky.on { color: var(--deal); border-color: var(--deal); }
.man-box { display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--deal); border-radius: 10px; padding: 12px 14px; }
.man-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--deal); }
.man-row input { width: 72px; padding: 5px 8px; font-family: var(--f-num); }
.receipt .sneaky { margin-left: 0; }
.receipt-head { flex-wrap: wrap; }
.receipt-head .num { white-space: nowrap; }
.man-edit { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.8rem; color: var(--deal); }
.man-edit input { width: 64px; padding: 3px 6px; font-family: var(--f-num); font-size: 0.8rem; }
.cost-card td .d.man { color: var(--deal); }
.linkish { border: 0; background: none; padding: 0; color: var(--deal); text-decoration: underline; cursor: pointer; font-size: inherit; }

a.btn { text-decoration: none; color: var(--fg); }
.pdf-ready { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; }
.pdf-ready-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.price-src { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.price-src-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toast-btn { margin-left: 10px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
code { font-family: var(--f-num); font-size: 0.9em; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 550; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 6px 24px rgb(0 0 0 / .2); }

@media (max-width: 1080px) {
  .layout, .layout[data-mode="summary"] { grid-template-columns: minmax(0, 1fr); }
  .rail ol { flex-direction: row; overflow-x: auto; position: static; gap: 4px; padding-bottom: 4px; }
  .rail li { flex: 0 0 auto; }
  .rail button { width: auto; grid-template-columns: 26px auto; }
  .rail .val { display: none; }
  .rail .n { grid-row: auto; }
  .receipt { position: static; }
}
@media (max-width: 560px) {
  .panel { padding: 18px; }
  .store-badge { display: none; }
  h2 { font-size: 1.35rem; }
  .q-row { grid-template-columns: minmax(0, 1fr) auto; }
  .q-row .acts { grid-column: 1 / -1; justify-content: flex-start; }
  .mod { grid-template-columns: auto minmax(0, 1fr); }
  .mod-price { grid-column: 2; text-align: left; }
  .mod-qty { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Angebotsmappe</h1><span class="store-badge" id="store-badge">Angebote nur auf diesem Gerät</span></div>
    <div class="top-actions" id="top-actions"></div>
  </div>
</div>
<div class="layout" id="layout">
  <nav class="rail" id="rail" aria-label="Schritte"></nav>
  <main id="main"></main>
  <aside class="receipt" id="receipt" aria-label="Kostenübersicht"></aside>

/* ============================================================
   Berechnung
   ============================================================ */
function calc(s = state, cat = catalog) {
  const lines = [];
  // Eine Zeile im TAIFUN-Angebot. sec: monthly | onetime | service
  const R = (sec, name, qty, unit, o = {}) => ({ sec, name, qty, unit: unit == null ? null : num(unit), code: o.code || "", disc: !!o.disc,
    ep: !!o.ep, aufwand: !!o.aufwand, unitName: o.unitName || "" });
  const seats = Math.max(1, int(s.hosting.seats)), extraAp = seats - 1, cloud = s.hosting.mode === "cloud";
  // Paket: 1. Arbeitsplatz plus Preis je weiterem Arbeitsplatz
  const pkg = cat.packages.find(p => p.id === s.pkg.id) || cat.packages[0];
  const pv = pkg.variants ? (cat.kiVariants.find(x => x.id === s.pkg.ki) || cat.kiVariants[0]) : pkg;
  const pLabel = pkg.variants ? `${pkg.name} ${pv.name}` : pkg.name;
  const pr = [R("monthly", pv.pdfName || pLabel, 1, pv.monthly, { code: pv.sku, disc: true })];
  if (extraAp) pr.push(R("monthly", pv.extraName || "Zusätzliche Arbeitsplatzlizenzen", extraAp, pv.perExtra, { code: pv.sku + "-AP", disc: true }));
  if (pkg.variants && pv.hpName) pr.push(R("monthly", pv.hpName, 1, null));
  lines.push({ id: "pkg", group: "Paket", label: pLabel, detail: extraAp ? `1. AP ${eur(pv.monthly)} + ${extraAp} weitere AP × ${eur(pv.perExtra)}` : `1 AP · ${pv.desc}`, qty: seats, rows: pr });

  if (cloud) {
    const cl = cat.cloud, inc = int(cl.included), extra = Math.max(0, seats - inc);
    lines.push({ id: "cloud", group: "Betrieb", label: "Cloud-Betrieb", detail: `Pauschale inkl. ${inc} Arbeitsplätze`,
      rows: [R("monthly", cl.pdfName || "Cloud-Betrieb", 1, cl.monthly, { code: cl.sku, disc: true })] });
    if (extra > 0) lines.push({ id: "cloud-extra", group: "Betrieb", label: "Weitere Arbeitsplätze (Cloud)", detail: `${extra} × ${eur(cl.perExtra)}`,
      rows: [R("monthly", cl.extraName || "Weitere Arbeitsplätze (Cloud)", extra, cl.perExtra, { code: cl.extraSku, disc: true })] });
  }
  // Einrichtung ist immer Teil des Angebots (Dienstleistung), Preis je nach Betriebsart
  const so = cloud ? cat.cloud : cat.local;
  lines.push({ id: "setup", group: "Einrichtung", label: so.setupName || `Einrichtung ${cloud ? "Cloud" : "lokal"}`, detail: cloud ? "Einrichtung Cloud" : "Einrichtung lokal",
    rows: [R("service", so.setupName || "Einrichtung", 1, so.once, { code: cloud ? cat.cloud.sku + "-SETUP" : cat.local.sku, disc: true, unitName: "Stk" })] });

  for (const m of cat.modules) {
    const sel = s.modules[m.id];
    if (!sel || !sel.on) continue;
    const disc = m.discountable !== false, rows = [];
    if (m.pricing === "perUser") {
      const q = int(sel.qty);
      rows.push(R("monthly", m.baseName || `${m.name} Grundgebühr`, 1, m.monthly, { code: m.sku, disc }));
      if (q) rows.push(R("monthly", m.userName || `${m.name} ${m.unit}`, q, m.perUser, { code: m.sku + "-USER", disc }));
      lines.push({ id: "mod-" + m.id, group: "Zusatzmodule", label: m.name, detail: `Grundpreis ${eur(m.monthly)} + ${q} ${m.unit} × ${eur(m.perUser)}`, qty: q, rows });
    } else {
      rows.push(R("monthly", m.pdfName || m.name, 1, m.monthly, { code: m.sku, disc }));
      lines.push({ id: "mod-" + m.id, group: "Zusatzmodule", label: m.name, detail: m.desc, rows });
    }
    if (num(m.once)) rows.push(R("onetime", m.onceName || `${m.name}, einmalige Bereitstellungsgebühr`, 1, m.once, { code: m.sku + "-SETUP", disc }));
  }

  const tr = cat.training, hours = Math.max(0, num(s.training.hours));
  for (const t of cat.trainings || []) {
    if (!trainingIncluded(t, s, cat)) continue;
    lines.push({ id: "train-" + t.id, group: "Schulung", label: t.name.replace(/\*\s*$/, ""), detail: t.aufwand ? `nach Aufwand, ${eur(t.price)} je Std` : "Pauschale", aufwand: !!t.aufwand,
      rows: [R("service", t.name, 1, t.price, { code: t.sku, aufwand: t.aufwand, disc: !!tr.discountable, unitName: "Stk" })] });
  }
  if (hours > 0) lines.push({ id: "training", group: "Schulung", label: tr.rateName || "Dienstleistung nach Stunden", detail: `${fmtH(hours)} Std × ${eur(tr.rate)}`,
    rows: [R("service", tr.rateName || "Zusätzliche Dienstleistungen", hours, tr.rate, { code: tr.sku, disc: !!tr.discountable, unitName: "Std" })] });
  // Anfahrt: im Angebot als Einzelpreis („EP“), nicht in der Summe
  const km = s.training.km == null || s.training.km === "" ? int(tr.km) : int(s.training.km);
  const kmRow = km ? R("onetime", tr.travelName || "km Anfahrt", km, tr.travel, { code: tr.travelSku, ep: true }) : null;

  // Rabatte je Zeile: Kondition (Neukunden) plus Sonderrabatt, zusammen höchstens 100 %
  const group = s.customer.type === "neu" ? cat.groups.find(g => g.id === s.customer.group) : null;
  const mPct = group ? num(group.monthlyPct) : 0, oPct = group ? num(group.oncePct) : 0;
  const months = group && mPct ? int(group.months) : 0;
  const special = Math.max(0, num(s.manual && s.manual.value));
  const allRows = [];
  for (const l of lines) {
    l.monthly = 0; l.once = 0; l.manualPct = 0;
    for (const r of l.rows) {
      const gp = r.disc ? (r.sec === "monthly" ? mPct : oPct) : 0, sp = r.disc && r.sec === "monthly" ? Math.min(100 - gp, special) : 0;
      r.gross = r.unit == null ? 0 : r2(r.qty * r.unit);
      r.pct = gp + sp;
      r.total = r.unit == null || r.ep || r.aufwand ? null : r2(r.gross * (1 - r.pct / 100));
      r.groupAmt = r.total == null ? 0 : r2(r.gross * gp / 100);
      r.specialAmt = r.total == null ? 0 : r2(r.gross - r.total - r.groupAmt);
      if (r.total != null) { if (r.sec === "monthly") l.monthly = r2(l.monthly + r.gross); else l.once = r2(l.once + r.gross); }
      l.manualPct = Math.max(l.manualPct, sp);
      allRows.push(r);
    }
    l.disc = l.rows.some(r => r.disc);
  }
  const sum = f => r2(allRows.reduce((a, r) => a + f(r), 0));
  const isM = r => r.sec === "monthly";
  const monthlySub = sum(r => isM(r) && r.total != null ? r.gross : 0), onceSub = sum(r => !isM(r) && r.total != null ? r.gross : 0);
  const mManual = sum(r => isM(r) ? r.specialAmt : 0), oManual = sum(r => isM(r) ? 0 : r.specialAmt);
  const mDisc = sum(r => isM(r) ? r.groupAmt : 0), oDisc = sum(r => isM(r) ? 0 : r.groupAmt);
  const monthlyNet = sum(r => isM(r) && r.total != null ? r.total : 0), onceNet = sum(r => !isM(r) && r.total != null ? r.total : 0);
  const vat = num(cat.vat) / 100;
  // Abschnitte für das Angebots-PDF, Reihenfolge wie bei TAIFUN (Cloud am Ende der Leistungsbestandteile)
  const order = lines.filter(l => !/^cloud/.test(l.id)).concat(lines.filter(l => /^cloud/.test(l.id)));
  const sections = {
    monthly: order.flatMap(l => l.rows).filter(isM),
    onetime: (kmRow ? [kmRow] : []).concat(lines.flatMap(l => l.rows).filter(r => r.sec === "onetime")),
    service: lines.flatMap(l => l.rows).filter(r => r.sec === "service")
  };
  return {
    lines, rows: allRows, sections, kmRow, group, mPct, oPct, months, special, monthlySub, onceSub, mManual, oManual, mDisc, oDisc, monthlyNet, onceNet,
    monthlyVat: r2(monthlyNet * vat), onceVat: r2(onceNet * vat),
    monthlyGross: r2(monthlyNet * (1 + vat)), onceGross: r2(onceNet * (1 + vat)),
    regularMonthly: monthlySub, pkgLabel: pLabel, isKi: !!pkg.variants, kiName: pkg.variants ? pv.name : null,
    noDiscM: lines.filter(l => l.monthly && !l.disc).map(l => l.label)
  };
}
function fmtH(h) { return String(h).replace(".", ","); }
// Schulungspauschale automatisch vorgesehen: bis X Nutzer, passend zu Paket oder gewähltem Modul
function trainingAuto(t, s = state, cat = catalog) {
  if (t.seminar && Math.max(1, int(s.hosting.seats)) > int(cat.training.flatMaxUsers)) return false;
  return (t.pkgs || []).includes(s.pkg.id) || !!(t.module && s.modules[t.module] && s.modules[t.module].on);
}
function trainingIncluded(t, s = state, cat = catalog) {
  const o = (s.trainingSel || {})[t.id];
  return o === undefined ? trainingAuto(t, s, cat) : !!o;
}
function discountText(g) {
  const parts = [];
  if (num(g.monthlyPct)) parts.push(`−${fmtH(num(g.monthlyPct))} % monatlich${int(g.months) ? ` für ${int(g.months)} Monate` : ""}`);
  if (num(g.oncePct)) parts.push(`−${fmtH(num(g.oncePct))} % einmalig`);
  return parts.length ? parts.join(" · ") : "Listenpreise";
}
function validUntil() { const d = state.createdAt ? new Date(state.createdAt) : new Date(); d.setDate(d.getDate() + int(catalog.validDays)); return d; }

/* ============================================================
   Salesforce – modulare Schnittstelle
   Ausgang: buildSfPayload() erzeugt Opportunity + Line Items nach
   der Feldzuordnung aus den Einstellungen. Ein Adapter übergibt sie.
   Eingang: importFromSalesforce() mappt einen Account-Datensatz.
   Weitere Adapter (z. B. Salesforce-Connector) in SF_ADAPTERS ergänzen.
   ============================================================ */
function sfValues(c) {
  const cu = state.customer;
  return {
    quoteNumber: offerNo(), company: cu.company, contact: cu.contact, email: cu.email, customerNo: cu.customerNo,
    customerType: cu.type === "neu" ? "Neukunde" : "Bestandskunde",
    group: c.group ? c.group.name : "",
    package: c.pkgLabel,
    hosting: state.hosting.mode === "cloud" ? "Cloud" : "Lokal",
    seats: Math.max(1, int(state.hosting.seats)),
    trainings: c.lines.filter(l => l.id.startsWith("train-")).map(l => l.label).join("; "),
    modules: c.lines.filter(l => l.group === "Zusatzmodule").map(l => l.qty ? `${l.label} (${l.qty})` : l.label).join("; "),
    trainingHours: Math.max(0, num(state.training.hours)),
    street: cu.street, zip: cu.zip, city: cu.city,
    monthlyNet: c.monthlyNet, onceNet: c.onceNet, discountMonths: c.months,
    validUntil: isoDate(validUntil()), note: state.note
  };
}
function buildSfPayload(c = calc()) {
  const sf = catalog.salesforce, vals = sfValues(c);
  const close = new Date(); close.setDate(close.getDate() + int(sf.closeDays));
  const opp = {};
  if (state.customer.sfOpportunityId) opp.Id = state.customer.sfOpportunityId;
  if (state.customer.sfAccountId) opp.AccountId = state.customer.sfAccountId;
  opp.Name = String(sf.nameTemplate || "{company}").replace(/\{(\w+)\}/g, (_, k) => vals[k] ?? "").trim() || offerNo();
  opp.StageName = sf.stage;
  opp.CloseDate = isoDate(close);
  for (const f of sf.exportFields) if (f.on && f.sf) opp[f.sf] = vals[f.key];
  const items = [];
  for (const r of c.rows) {
    if (r.total == null || !r.unit || !r.qty) continue;
    const row = { ProductCode: r.code, Description: r.name, Quantity: r.qty, UnitPrice: r.unit };
    if (r.pct) row.Discount = r.pct;
    if (sf.billingField) row[sf.billingField] = r.sec === "monthly" ? "monatlich" : "einmalig";
    items.push(row);
  }
  return {
    source: "Angebotsrechner", quoteNumber: offerNo(), createdAt: new Date().toISOString(),
    discount: c.group ? { group: c.group.name, monthlyPct: c.mPct, oncePct: c.oPct, months: c.months, monthlyAmount: c.mDisc, onceAmount: c.oDisc } : null,
    totals: { specialMonthly: c.mManual, specialOnce: c.oManual, monthlyNet: c.monthlyNet, onceNet: c.onceNet, monthlyGross: c.monthlyGross, onceGross: c.onceGross, vatPct: num(catalog.vat) },
    Opportunity: opp,
    OpportunityLineItems: items
  };
}
function importFromSalesforce(text) {
  let rec = JSON.parse(text);
  if (rec && Array.isArray(rec.records)) rec = rec.records[0];
  if (Array.isArray(rec)) rec = rec[0];
  if (!rec || typeof rec !== "object") throw new Error("Kein Datensatz gefunden.");
  let n = 0;
  for (const f of catalog.salesforce.importFields) {
    const v = getPath(rec, f.sf);
    if (v != null && v !== "" && IMPORT_KEYS[f.key]) { state.customer[f.key] = String(v); n++; }
  }
  return n;
}

async function saveQuote(sfStatus) {
  const c = calc();
  const now = new Date().toISOString();
  if (!state.createdAt) state.createdAt = now;
  if (sfStatus) state.sfStatus = sfStatus;
  const id = state.quoteId || "q-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const snap = clone(state); delete snap.step;
  const doc = {
    number: offerNo(), company: state.customer.company || "", customerType: state.customer.type,
    packageLabel: c.pkgLabel, hosting: state.hosting.mode, monthlyNet: c.monthlyNet, onceNet: c.onceNet,
    createdAt: state.createdAt, updatedAt: now, sfStatus: state.sfStatus, state: snap, sfPayload: buildSfPayload(c)
  };
  if (caps.db) {
    try { await caps.db.collection("quotes").doc(id).set(doc); }
    catch (e) { throw new Error(e && e.code === "invalid_argument" ? "Keine Berechtigung zum Speichern. Bitte Bearbeitungsrechte für diesen Rechner anfragen." : "Speichern fehlgeschlagen. Bitte gleich noch einmal versuchen."); }
  } else {
    const all = lsGet("quotes", {}); all[id] = doc;
    if (!lsSet("quotes", all)) throw new Error("Der Browser erlaubt hier kein Speichern.");
    quotes = listFromObj(all);
  }
  state.quoteId = id;
}
async function deleteQuote(id) {
  if (caps.db) await caps.db.collection("quotes").doc(id).delete();
  else { const all = lsGet("quotes", {}); delete all[id]; lsSet("quotes", all); quotes = listFromObj(all); }
}
async function setQuoteStatus(id, status) {
  if (caps.db) await caps.db.collection("quotes").doc(id).update({ sfStatus: status, updatedAt: new Date().toISOString() });
  else { const all = lsGet("quotes", {}); if (all[id]) { all[id].sfStatus = status; lsSet("quotes", all); quotes = listFromObj(all); } }
}
function listFromObj(o) { return Object.entries(o || {}).map(([id, d]) => ({ id, ...d })).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))); }
async function saveCatalog(cat) {
  if (caps.db) {
    try { await caps.db.doc("settings/catalog").set({ catalog: cat, updatedAt: new Date().toISOString() }); }
    catch (e) { throw new Error(e && e.code === "invalid_argument" ? "Nur Bearbeiter dürfen die Einstellungen ändern." : "Speichern fehlgeschlagen. Bitte gleich noch einmal versuchen."); }
  } else {
    if (!lsSet("catalog", cat)) throw new Error("Der Browser erlaubt hier kein Speichern.");
    localPrices = true;
  }
}

/* ---------- Preisdatei (lokal, z. B. im gemeinsamen OneDrive-Ordner) ----------
   PC (Edge/Chrome): Datei wird verknüpft und bei jedem Start neu gelesen, Änderungen lassen sich zurückschreiben.
   iPad/Safari: Datei über die Dateien-App öffnen, die Preise werden auf dem Gerät gespeichert. */
const canLink = "showOpenFilePicker" in window;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("angebotsmappe", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  try { const d = await idb(); return await new Promise((res, rej) => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch { return undefined; }
}
async function idbSet(k, v) {
  try {
    const d = await idb();
    await new Promise((res, rej) => { const t = d.transaction("kv", "readwrite"); const st = t.objectStore("kv"); if (v === undefined) st.delete(k); else st.put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
  } catch {}
}
function parsePriceFile(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error("Die Datei ist kein gültiges JSON."); }
  if (!data || !Array.isArray(data.packages) || !Array.isArray(data.modules)) throw new Error("Das ist keine Preisdatei der Angebotsmappe.");
  return data;
}
function applyFilePrices(data, meta) {
  lsSet("catalog", data); lsSet("catalogMeta", meta);
  catalog = mergeCatalog(data); localPrices = true; priceMeta = meta;
  if (view === "settings") { draft = clone(catalog); settingsDirty = false; }
  if (!catalog.groups.some(g => g.id === state.customer.group)) state.customer.group = "none";
}
async function readLinkedFile(handle) {
  const f = await handle.getFile();
  applyFilePrices(parsePriceFile(await f.text()), { source: "datei", name: f.name, linked: true, modified: f.lastModified, read: Date.now() });
}
async function initPriceFile() {
  if (!canLink) return;
  const handle = await idbGet("priceHandle");
  if (!handle) return;
  priceFile = { handle, name: handle.name, needsPermission: false };
  try {
    if ((await handle.queryPermission({ mode: "read" })) === "granted") await readLinkedFile(handle);
    else priceFile.needsPermission = true;
  } catch (e) { priceFile.error = e.message && e.message.startsWith("D") ? e.message : "Die Preisdatei konnte nicht gelesen werden. Liegt sie noch am selben Ort?"; }
}
async function ensurePermission(handle, mode) {
  if ((await handle.queryPermission({ mode })) === "granted") return true;
  return (await handle.requestPermission({ mode })) === "granted";
}
// Muss aus einem Klick heraus laufen: Der Browser fragt dann einmal, ob die App die Datei lesen darf.
async function reloadPriceFile() {
  if (!priceFile) return;
  try {
    if (!(await ensurePermission(priceFile.handle, "read"))) { toast("Ohne Erlaubnis kann die App die Preisdatei nicht lesen."); return; }
    await readLinkedFile(priceFile.handle); priceFile.needsPermission = false; priceFile.error = null;
    rerenderKeepFocus(); toast("Preise neu eingelesen.");
  } catch (e) { priceFile.error = e.message && e.message.startsWith("D") ? e.message : "Die Preisdatei konnte nicht gelesen werden. Liegt sie noch am selben Ort?"; rerenderKeepFocus(); }
}
// Einstellungen in die Preisdatei schreiben und danach wieder einlesen (prüft die Datei gleich mit)
async function writePriceFile(handle) {
  const data = clone(draft); data.example = false;
  const w = await handle.createWritable();
  await w.write(JSON.stringify(data, null, 2) + "\n"); await w.close();
  await readLinkedFile(handle);
}
const fmtDateTime = t => new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
function priceSourceBox() {
  const openBtn = canLink
    ? `<button class="btn ${priceFile ? "" : "primary"}" data-act="price-link">${priceFile ? "Andere Datei verknüpfen…" : "Preisdatei verknüpfen…"}</button>`
    : `<button class="btn ${priceMeta && priceMeta.source === "datei" ? "" : "primary"}" data-act="price-open">Preisdatei öffnen…</button>`;
  let title, detail, btns;
  if (priceFile) {

    detail = priceFile.error ? priceFile.error
      : priceFile.needsPermission ? "Der Browser fragt nach einem Neustart einmal nach, ob die App die Datei lesen darf."
      : `Wird bei jedem Start neu gelesen. Zuletzt ${fmtDateTime(priceMeta.read)}, Datei vom ${fmtDateTime(priceMeta.modified)}.`;
    btns = `<button class="btn primary" data-act="price-reload">${priceFile.needsPermission ? "Preisdatei einlesen" : "Neu einlesen"}</button>${openBtn}<button class="btn danger" data-act="price-unlink">Verknüpfung lösen</button>`;

    btns = openBtn;
  }
  return `<div class="price-src"><div class="price-src-t"><p class="eyebrow">Preisquelle</p><p><b>${title}</b></p><p class="small muted">${detail}</p></div><div class="actions">${btns}</div></div>`;
}

function costRows(c, f) {

    const gp = l.disc ? (f === "monthly" ? c.mPct : c.oPct) : 0;
    const total = l.manualPct && gp ? ` · insgesamt −${fmtH(r2(l.manualPct + gp))} %` : "";
    const extra = l.manualPct ? `<span class="d man">−${fmtH(l.manualPct)} % Sonderrabatt${total}</span>` : "";
    return `<tr><td>${esc(l.label)}${d}${extra}</td><td class="m">${l.aufwand && !l[f] ? "nach Aufwand" : eur(l[f])}</td></tr>`;

function updateLive() {

let tplInfo = lsGet("tplInfo"); // { name, pages, ki, read }
async function setTemplate(bytes, name, handle) {
  if (!window.AngebotPDF) throw new Error("Die PDF-Funktion ist hier nicht verfügbar.");
  const info = await AngebotPDF.inspect(bytes);
  if (!info.ok) throw new Error("Das PDF sieht nicht wie ein TAIFUN-Aboangebot aus. Bitte ein Angebot mit Anschreiben und Angebotsübersicht wählen.");
  await idbSet("tplBytes", bytes); await idbSet("tplHandle", handle);
  tplInfo = { name, pages: info.pages, ki: info.ki, read: Date.now() }; lsSet("tplInfo", tplInfo);
}
// Am PC die verknüpfte Datei frisch lesen, sonst die gespeicherte Kopie nehmen
async function templateBytes() {
  const h = canLink ? await idbGet("tplHandle") : null;
  if (h) {
    try {
      if (await ensurePermission(h, "read")) {
        const bytes = new Uint8Array(await (await h.getFile()).arrayBuffer());
        await idbSet("tplBytes", bytes); return bytes;
      }
    } catch { /* Datei nicht erreichbar: gespeicherte Kopie */ }
  }
  return await idbGet("tplBytes");
}
const NUM2 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function pdfData(c = calc()) {
  const cu = state.customer, created = state.createdAt ? new Date(state.createdAt) : new Date();
  const row = r => ({ name: r.name, qty: r.qty, unit: r.unit, pct: r.pct, total: r.total, ep: r.ep, unitName: r.unitName });
  const total = k => r2(c.sections[k].reduce((a, r) => a + (r.total || 0), 0));
  const term = int(catalog.termMonths) || 24;
  const except = catalog.modules.filter(m => m.discountable === false && state.modules[m.id] && state.modules[m.id].on).map(m => m.name.replace(/\s*\(.*\)\s*$/, ""));
  const discounted = c.sections.monthly.some(r => r.pct > 0);
  return {
    offerNo: offerNo(), date: fmtDate(created), validUntil: fmtDate(validUntil()), customerNo: cu.customerNo,
    customer: { name: cu.company, contact: cu.contact, street: cu.street, zip: cu.zip, city: cu.city },
    seller: lsGet("profile", {}) || {}, hosting: state.hosting.mode,
    app: !!(state.modules.app && state.modules.app.on), ki: c.kiName, kiNote: c.isKi,
    monthly: { rows: c.sections.monthly.map(row), total: c.monthlyNet },
    onetime: { rows: c.sections.onetime.map(row), total: total("onetime") },
    service: { rows: c.sections.service.map(row), total: total("service") },
    discountText: discounted ? `Der rabattierte Preis beträgt somit ${NUM2.format(c.monthlyNet)} € und ist ${c.months && c.months < term ? `für die ersten ${c.months} Monate gültig` : "gültig während der Grundlaufzeit des Vertrages"}.${except.length ? ` Ausgenommen davon ${except.join(", ")}.` : ""}` : "",
    invoiceEmail: ""
  };
}
function pdfFileName() {
  const name = (state.customer.company || "Angebot").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_").slice(0, 60);
  return `Aboangebot_${offerNo()}_${name}.pdf`;
}
function shareOrDownload(file) {
  $("toast").hidden = true;
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: file.name }).catch(() => {}); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
// Erst das PDF erstellen, dann über einen eigenen Klick speichern. Der Speichern-Dialog braucht einen frischen Klick,
// sonst bricht der Browser ihn nach dem Erstellen still ab.
let lastPdf = null; // { name, blob, url, sig }
async function makePdf(btn) {
  const cu = state.customer, missing = [];
  if (!cu.company) missing.push("Firma");
  if (!cu.customerNo) missing.push("Kundennummer");
  if (!cu.street || !cu.city) missing.push("Anschrift");
  if (missing.length) { toast(`Für das Angebots-PDF fehlt noch: ${missing.join(", ")} (Schritt 1).`); return; }
  if (!window.AngebotPDF) { toast("Die PDF-Funktion ist hier nicht verfügbar."); return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = "PDF wird erstellt …";
  try {
    const bytes = await templateBytes();
    if (!bytes) { draft = clone(catalog); settingsDirty = false; view = "settings"; settingsTab = "pdf"; render(); toast("Bitte zuerst die TAIFUN-Vorlage öffnen."); return; }
    if (!state.createdAt) state.createdAt = new Date().toISOString();
    const data = pdfData(), pdf = await AngebotPDF.build(bytes, data);
    if (lastPdf) URL.revokeObjectURL(lastPdf.url);
    const blob = new Blob([pdf], { type: "application/pdf" });
    lastPdf = { name: pdfFileName(), blob, url: URL.createObjectURL(blob), sig: JSON.stringify(data) };
    render();
    const box = $("pdf-ready"); if (box) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    toast("Das Angebots-PDF ist fertig.");
  } catch (err) { console.error(err); toast(err.message || "Das PDF konnte nicht erstellt werden."); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
}
function pdfReady() { return lastPdf && lastPdf.sig === JSON.stringify(pdfData()) ? lastPdf : null; }
async function savePdf() {
  const p = pdfReady();
  if (!p) { toast("Das Angebot wurde geändert. Bitte das PDF neu erstellen."); render(); return; }
  if (caps.downloads) {
    try { await caps.downloads.save({ filename: p.name, data: p.blob }); } catch (err) { if (err && err.code !== "declined") toast("Das PDF konnte nicht gespeichert werden."); }
    return;
  }
  // PC: Ort wählen, z. B. den OneDrive-Ordner „Angebote“
  if ("showSaveFilePicker" in window) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: p.name, id: "angebote", types: [{ description: "PDF", accept: { "application/pdf": [".pdf"] } }] });
      const w = await h.createWritable(); await w.write(p.blob); await w.close();
      toast(`Gespeichert: ${h.name}`); return;
    } catch (err) {
      if (err && err.name === "AbortError") { toast("Speichern abgebrochen."); return; }
      console.warn("Speichern-Dialog nicht verfügbar", err); // dann als normaler Download
    }
  }
  const file = new File([p.blob], p.name, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: p.name }); return; } catch (err) { if (err && err.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = p.url; a.download = p.name; document.body.append(a); a.click(); a.remove();
  toast("Das PDF liegt im Download-Ordner.");
}

/* ---------- Toast & Datei/Clipboard ---------- */
let toastT;
function toast(msg, action) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  if (action) {
    const b = document.createElement("button"); b.className = "toast-btn"; b.textContent = action.label;
    b.addEventListener("click", action.fn); t.append(" ", b);
  }
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 15000 : 3800);
}
// Datei an den Nutzer geben: in claude.ai über die Download-Funktion, sonst als normaler Browser-Download
function saveFile(filename, text) {
  if (caps.downloads) return caps.downloads.save({ filename, data: text });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = filename; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return Promise.resolve();
}
function copyJson(payload) {
  const text = JSON.stringify(payload, null, 2);
  const fallback = () => {
    const box = $("sf-box"); if (box) box.open = true;
    const pre = $("sf-json"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    return "Kopieren nicht erlaubt. Der Text ist markiert, bitte mit Strg+C kopieren.";
  };
  try {
    return navigator.clipboard.writeText(text).then(() => "Salesforce-Daten kopiert.").catch(fallback);
  } catch { return Promise.resolve(fallback()); }
}
async function downloadJson(payload) {
  try {
    await saveFile(`${offerNo()}.json`, JSON.stringify(payload, null, 2));
    toast("Datei gespeichert.");
  } catch (e) { if (e && e.code !== "declined") toast("Die Datei konnte nicht gespeichert werden."); }
}

function rerenderKeepFocus() {
  const a = document.activeElement, id = a && a.id;
  render();
  if (id) { const el = document.getElementById(id); if (el) el.focus({ preventScroll: true }); }
}
// Ein Zahlenfeld meldet "change" beim Verlassen, also schon beim Maus-Drücken auf einen Button.
// Neu zeichnen erst nach dem Loslassen, sonst geht der Klick auf den Button verloren.
let pointerDown = false, pendingRender = false;
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => {
  pointerDown = false;
  if (pendingRender) setTimeout(() => { if (pendingRender) { pendingRender = false; rerenderKeepFocus(); } }, 0);
}, true);
function softRerender() { if (pointerDown) pendingRender = true; else rerenderKeepFocus(); }
const armed = new Map();
function arm(btn, key, label) {
  if (armed.get(key)) { armed.delete(key); return true; }
  armed.set(key, true); const old = btn.textContent; btn.textContent = label; btn.classList.add("armed");
  setTimeout(() => { armed.delete(key); if (btn.isConnected) { btn.textContent = old; btn.classList.remove("armed"); } }, 4000);
  return false;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case "set": setPath(state, b.dataset.path, "num" in b.dataset ? num(b.dataset.value) : b.dataset.value); rerenderKeepFocus(); break;
    case "inc": case "dec": {
      const p = b.dataset.path, by = num(b.dataset.by || 1), min = num(b.dataset.min || 0);
      setPath(state, p, Math.max(min, num(getPath(state, p)) + (act === "inc" ? by : -by))); rerenderKeepFocus(); break;
    }
    case "goto": state.step = +b.dataset.step; render(); scrollTo({ top: 0 }); break;
    case "next": state.step = Math.min(STEPS.length - 1, state.step + 1); render(); scrollTo({ top: 0 }); break;
    case "prev": state.step = Math.max(0, state.step - 1); render(); scrollTo({ top: 0 }); break;
    case "toggle-mod": { const m = state.modules[b.dataset.id] || (state.modules[b.dataset.id] = { on: false, qty: 1 }); m.on = !m.on; rerenderKeepFocus(); break; }
    case "view":
      if (b.dataset.view === "settings" && view !== "settings") { draft = clone(catalog); settingsDirty = false; }
      view = b.dataset.view; render(); scrollTo({ top: 0 }); break;
    case "new-quote": state = freshState(); view = "wizard"; render(); scrollTo({ top: 0 }); toast("Neues Angebot angelegt."); break;
    case "sf-import": {
      const msg = $("sf-import-msg");
      try { const n = importFromSalesforce($("sf-import-text").value); render(); const box = $("sf-import-box"); if (box) box.open = true; $("sf-import-msg").textContent = n ? `${n} Felder übernommen.` : "Keine passenden Felder gefunden. Zuordnung unter Einstellungen → Salesforce prüfen."; }
      catch { msg.textContent = "Das ist kein gültiges JSON. Bitte den kompletten Datensatz einfügen."; }
      break;
    }
    case "save-quote":
      try { await saveQuote(); render(); toast("Angebot gespeichert."); } catch (err) { toast(err.message); }
      break;
    case "sf-send": {
      const ad = SF_ADAPTERS[catalog.salesforce.adapter] || SF_ADAPTERS.outbox;
      try { const r = await ad.send(buildSfPayload()); render(); if (r) toast(r); } catch (err) { toast(err.message || "Übergabe fehlgeschlagen."); }
      break;
    }
    case "copy-json": { const r = await copyJson(buildSfPayload()); toast(r); break; }
    case "download-json": downloadJson(buildSfPayload()); break;
    case "open-quote": {
      const q = quotes.find(x => x.id === b.dataset.id); if (!q) break;
      state = { ...freshState(), ...clone(q.state), quoteId: q.id, step: STEPS.length - 1, sfStatus: q.sfStatus || "entwurf" };
      view = "wizard"; render(); scrollTo({ top: 0 }); break;
    }
    case "del-quote":
      if (!arm(b, "del-" + b.dataset.id, "Wirklich löschen?")) break;
      try { await deleteQuote(b.dataset.id); if (state.quoteId === b.dataset.id) state.quoteId = null; render(); toast("Angebot gelöscht."); } catch { toast("Löschen fehlgeschlagen. Fehlen die Bearbeitungsrechte?"); }
      break;
    case "toggle-train": {
      const t = catalog.trainings.find(x => x.id === b.dataset.id); if (!t) break;
      const next = !trainingIncluded(t);
      state.trainingSel = state.trainingSel || {};
      if (next === trainingAuto(t)) delete state.trainingSel[t.id]; else state.trainingSel[t.id] = next;
      rerenderKeepFocus(); break;
    }
    case "toggle-manual": state.manual = state.manual || { on: false, value: 0 }; state.manual.on = !state.manual.on; rerenderKeepFocus(); break;
    case "clear-manual": state.manual = { on: true, value: 0 }; render(); toast("Sonderrabatt entfernt."); break;
    case "toggle-tpkg": {
      const t = draft.trainings[+b.dataset.i], set = new Set(t.pkgs || []);
      if (set.has(b.dataset.pkg)) set.delete(b.dataset.pkg); else set.add(b.dataset.pkg);
      t.pkgs = [...set]; settingsDirty = true; rerenderKeepFocus(); break;
    }
    case "add-training":
      draft.trainings.push({ id: "t" + Date.now().toString(36), name: "Neue Position", price: 0, pkgs: [], module: "", sku: "", seminar: false, aufwand: false });
      settingsDirty = true; render(); break;
    case "tab": settingsTab = b.dataset.tab; render(); break;
    case "tpl-link":
      try {
        const [h] = await window.showOpenFilePicker({ types: [{ description: "TAIFUN-Angebot (PDF)", accept: { "application/pdf": [".pdf"] } }] });
        await setTemplate(new Uint8Array(await (await h.getFile()).arrayBuffer()), h.name, h);
        render(); toast(`Vorlage „${h.name}“ verknüpft.`);
      } catch (err) { if (err && err.name !== "AbortError") toast(err.message || "Die Vorlage konnte nicht gelesen werden."); }
      break;
    case "tpl-open": $("tpl-input").click(); break;
    case "tpl-remove":
      if (!arm(b, "tpl", "Wirklich entfernen?")) break;
      await idbSet("tplBytes", undefined); await idbSet("tplHandle", undefined);
      tplInfo = null; try { localStorage.removeItem("angebotsrechner:tplInfo"); } catch {}
      render(); toast("Vorlage entfernt."); break;
    case "pdf-make": await makePdf(b); break;
    case "pdf-save": await savePdf(); break;
    case "add-module":
      draft.modules.push({ id: "m" + Date.now().toString(36), name: "Neues Modul", desc: "", pricing: "flat", monthly: 0, perUser: 0, unit: "Nutzer", once: 0, sku: "", discountable: true, pdfName: "", baseName: "", userName: "", onceName: "" });
      settingsDirty = true; render(); break;
    case "add-group":
      draft.groups.push({ id: "g" + Date.now().toString(36), name: "Neue Kondition", monthlyPct: 0, oncePct: 0, months: 0 });
      settingsDirty = true; render(); break;
    case "add-import":
      draft.salesforce.importFields.push({ sf: "", key: "company" }); settingsDirty = true; render(); break;
    case "del-row": getPath(draft, b.dataset.list).splice(+b.dataset.i, 1); settingsDirty = true; render(); break;
    case "reset-settings":
      if (!arm(b, "reset", "Wirklich zurücksetzen?")) break;
      draft = clone(DEFAULT_CATALOG); settingsDirty = true; render(); toast("Beispielwerte geladen. Zum Übernehmen speichern."); break;
    case "export-catalog": {
      const data = clone(draft); data.example = false;
      try { await saveFile("preise.json", JSON.stringify(data, null, 2) + "\n"); toast("preise.json gesichert. Jetzt in den gemeinsamen Ordner legen."); }
      catch (e) { if (e && e.code !== "declined") toast("Die Datei konnte nicht gespeichert werden."); }
      break;
    }
    case "use-central":
      if (!arm(b, "central", "Wirklich?")) break;
      try { localStorage.removeItem("angebotsrechner:catalog"); localStorage.removeItem("angebotsrechner:catalogMeta"); } catch {}
      localPrices = false; priceMeta = null; catalog = centralCatalog ? clone(centralCatalog) : clone(DEFAULT_CATALOG);
      draft = clone(catalog); settingsDirty = false; render(); toast(centralCatalog && !centralCatalog.example ? "Preise vom Server werden verwendet." : "Beispielpreise werden verwendet."); break;
    case "price-link":
      try {
        const [h] = await window.showOpenFilePicker({ types: [{ description: "Preisdatei", accept: { "application/json": [".json"] } }] });
        await readLinkedFile(h); await idbSet("priceHandle", h);
        priceFile = { handle: h, name: h.name, needsPermission: false };
        render(); toast(`Preisdatei „${h.name}“ verknüpft.`);
      } catch (e) { if (e && e.name !== "AbortError") toast(e.message || "Die Datei konnte nicht gelesen werden."); }
      break;
    case "price-reload": await reloadPriceFile(); break;
    case "price-unlink":
      if (!arm(b, "unlink", "Wirklich lösen?")) break;
      await idbSet("priceHandle", undefined); priceFile = null;
      try { localStorage.removeItem("angebotsrechner:catalog"); localStorage.removeItem("angebotsrechner:catalogMeta"); } catch {}
      localPrices = false; priceMeta = null; catalog = centralCatalog ? clone(centralCatalog) : clone(DEFAULT_CATALOG);
      draft = clone(catalog); settingsDirty = false; render(); toast("Verknüpfung gelöst."); break;
    case "price-open": $("price-input").click(); break;
    case "price-write":
      try {
        if (!(await ensurePermission(priceFile.handle, "readwrite"))) { toast("Ohne Erlaubnis kann die App nicht in die Preisdatei schreiben."); break; }
        await writePriceFile(priceFile.handle);
        render(); toast("In der Preisdatei gespeichert. Gilt für alle, die sie nutzen.");
      } catch (e) { toast("Speichern in der Preisdatei fehlgeschlagen."); }
      break;
    case "price-create":
      // Erste Preisdatei am PC anlegen: Ort wählen (z. B. OneDrive), Datei schreiben und gleich verknüpfen
      try {
        const h = await window.showSaveFilePicker({ suggestedName: "preise.json", types: [{ description: "Preisdatei", accept: { "application/json": [".json"] } }] });
        await writePriceFile(h); await idbSet("priceHandle", h);
        priceFile = { handle: h, name: h.name, needsPermission: false };
        render(); toast(`Preisdatei „${h.name}“ gespeichert und verknüpft.`);
      } catch (e) { if (e && e.name !== "AbortError") toast("Die Preisdatei konnte nicht gespeichert werden."); }
      break;
    case "cancel-settings": draft = clone(catalog); settingsDirty = false; view = "wizard"; render(); break;
    case "save-settings": {
      const next = clone(draft); next.example = false;
      try {
        await saveCatalog(next); if (!caps.shared) { priceMeta = { source: "geraet" }; lsSet("catalogMeta", priceMeta); } catalog = mergeCatalog(next); draft = clone(catalog); settingsDirty = false;
        if (!catalog.groups.some(g => g.id === state.customer.group)) state.customer.group = "none";
        render(); toast(caps.shared ? "Einstellungen gespeichert." : "Auf diesem Gerät gespeichert.");
      } catch (err) { toast(err.message); }
      break;
    }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.pbind) { const prof = lsGet("profile", {}) || {}; prof[t.dataset.pbind] = t.value.trim(); lsSet("profile", prof); return; }
  if (t.dataset.bind) { setPath(state, t.dataset.bind, t.type === "number" ? Math.max(0, num(t.value)) : readVal(t)); updateLive(); }
  else if (t.dataset.cbind) { setPath(draft, t.dataset.cbind, readVal(t)); settingsDirty = true; const s = $("settings-status"); if (s) s.textContent = "Ungespeicherte Änderungen"; }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "tpl-input" && t.files && t.files[0]) {
    const f = t.files[0]; t.value = "";
    try { await setTemplate(new Uint8Array(await f.arrayBuffer()), f.name, undefined); render(); toast(`Vorlage „${f.name}“ übernommen.`); }
    catch (err) { toast(err.message || "Die Vorlage konnte nicht gelesen werden."); }
    return;
  }
  if (t.id === "price-input" && t.files && t.files[0]) {
    const f = t.files[0]; t.value = "";
    try { applyFilePrices(parsePriceFile(await f.text()), { source: "datei", name: f.name, linked: false, modified: f.lastModified, read: Date.now() }); render(); toast(`Preise aus „${f.name}“ übernommen.`); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.bind && t.type === "number") softRerender();
  if (t.dataset.cbind && t.tagName === "SELECT") softRerender();
  if (t.dataset.qstatus) {
    try { await setQuoteStatus(t.dataset.qstatus, t.value); if (state.quoteId === t.dataset.qstatus) state.sfStatus = t.value; toast("Status geändert."); }
    catch { toast("Status konnte nicht geändert werden."); render(); }
  }
});

   ============================================================ */
// Offline-Speicher (wie bei der Unterschriftenmappe): App läuft nach dem ersten Start auch ohne Netz
function registerOffline() {
  if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || location.hostname === "localhost")) return;
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("Offline-Speicher", e));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    toast("Eine neue Version ist da.", { label: "Neu laden", fn: () => location.reload() });
  });
}
(async function init() {
  const lc = lsGet("catalog"); if (lc) { catalog = mergeCatalog(lc); localPrices = true; }
  quotes = listFromObj(lsGet("quotes", {}));
  render();
  registerOffline();
  await initPriceFile();
  if (priceFile) {
    rerenderKeepFocus();
    if (priceFile.needsPermission) toast(`Preise aus „${priceFile.name}“ einlesen?`, { label: "Einlesen", fn: () => { $("toast").hidden = true; reloadPriceFile(); } });
  }
  centralCatalog = await loadCentral();
  if (centralCatalog && !localPrices) {
    catalog = clone(centralCatalog);
    if (view === "settings" && !settingsDirty) draft = clone(catalog);
    rerenderKeepFocus();
  }
  if (!window.claude || !window.claude.use) return;
  const [db, user, dl] = await Promise.all(["db", "user", "downloads"].map(n => window.claude.use(n).catch(() => null)));
  caps.downloads = dl; caps.user = user;
  if (!db) { render(); return; }
  caps.db = db; caps.shared = true; quotes = [];
  if (user) { try { caps.canEditSettings = await user.canEdit(); } catch { caps.canEditSettings = true; } }
  db.doc("settings/catalog").onSnapshot(s => {
    catalog = s.exists && s.data().catalog ? mergeCatalog(s.data().catalog) : clone(DEFAULT_CATALOG);
    if (view === "settings" && settingsDirty) renderTop(); else { if (view === "settings") draft = clone(catalog); rerenderKeepFocus(); }
  }, () => toast("Einstellungen konnten nicht geladen werden. Es gelten die zuletzt geladenen Preise."));
  db.collection("quotes").orderBy("updatedAt", "desc").limit(300).onSnapshot(s => {
    quotes = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (view === "quotes") render(); else renderTop();
  }, () => toast("Gespeicherte Angebote konnten nicht geladen werden."));
  render();
})();
</script>
